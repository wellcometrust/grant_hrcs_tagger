[project]
name = "grant-hrcs-tagger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "akin>=2.1.0",
    "click>=8.5.1",
    "flash-attn==2.7.4.post1; sys_platform == 'linux'",
    "jupyterlab>=4.6.6",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "ruff>=0.17.5",
    "sagemaker>=2.75.1",
    "scikit-learn>=1.9.1",
    "scikit-multilearn>=0.2.0",
    "setuptools>=84.2.1",
    "torch>=2.15.0",
    "transformers[torch]>=5.23.0",
    "wandb>=0.31.0",
]

[project.scripts]
grant-hrcs-tagger = "grant_hrcs_tagger:main"

[tool.uv.extra-build-dependencies]
flash-attn = [
    {requirement = "torch", match-runtime = true},
    "setuptools>=81",
    "wheel",
]

[tool.uv.extra-build-variables]
flash-attn = {FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE"}

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pydocstyle
    "D",
]
ignore = ["D100", "D104", "E501"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "dotenv>=0.9.9",
    "ipykernel>=6.29.5",
]
